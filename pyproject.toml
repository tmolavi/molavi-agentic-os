[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "molavi-agentic-os"
version = "0.2.0"
description = "TM Molavi Agentic OS: Modular, model-agnostic operating ecosystem for autonomous AI agents, skills, teams, and MCP tools."
readme = "README.md"
authors = [
    { name = "Taghi Molavi", email = "contact@molavi.pro" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
    "agentic-os",
    "ai-agents",
    "multi-agent",
    "mcp",
    "model-context-protocol",
    "hermes-agent",
    "llm-orchestration",
    "autonomous-agents",
    "crewai-alternative",
    "langgraph-alternative",
    "antigravity",
    "claude-code",
    "codex",
    "foreman-verification",
    "free-first-ai",
    "zero-dependency"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent"
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "build>=1.0.0",
    "twine>=5.0.0"
]

[project.urls]
Homepage = "https://molavi.pro"
Documentation = "https://github.com/tmolavi/molavi-agentic-os/tree/main/docs"
Repository = "https://github.com/tmolavi/molavi-agentic-os"
Issues = "https://github.com/tmolavi/molavi-agentic-os/issues"
Changelog = "https://github.com/tmolavi/molavi-agentic-os/blob/main/CHANGELOG.md"

[project.scripts]
molavi-agentic-os = "molavi_agentic_os.cli:main"
tm-agentic-os = "molavi_agentic_os.cli:main"
